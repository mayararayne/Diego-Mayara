# Site estático em site/ + funções em netlify/functions (mural de recados e confirmação de presença).
[build]
  publish = "site"
  command = "npm install --no-audit --no-fund"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
